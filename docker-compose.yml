# PALINOR Big Data infrastructure: Kafka (KRaft) · HBase · Neo4j · Spark
# Host access:  Kafka localhost:9092 · HBase Thrift localhost:9090 (UI :16010)
#               Neo4j bolt localhost:7687 (UI :7474) · Spark UI :4040 while a job runs
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: palinor-kafka
    restart: unless-stopped        # come back by themselves when Docker restarts
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: -1          # keep every event (was 168 = deleted after 7 days)
      KAFKA_LOG_DIRS: /var/lib/kafka/data     # on the kafka-data volume, so it survives container re-creation
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in project-events participant-events task-events command-events context-events \
                 finding-events experiment-events execution-events github-events decision-events \
                 error-events message-events analytics-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic $$t --partitions 6 --replication-factor 1
        done

  kafka-ui:                                # browse topics and messages in a web page (http://localhost:8090)
    image: kafbat/kafka-ui:v1.0.0
    container_name: palinor-kafka-ui
    restart: unless-stopped
    depends_on: { kafka: { condition: service_healthy } }
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: palinor
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"

  hbase:
    image: harisekhon/hbase:2.1
    container_name: palinor-hbase
    restart: unless-stopped        # come back by themselves when Docker restarts
    hostname: hbase
    volumes: ["hbase-data:/hbase-data", "hbase-zk:/tmp/hbase-root"]   # rootdir + ZooKeeper state, kept together
    ports: ["9090:9090", "16010:16010", "2181:2181"]

  neo4j:
    image: neo4j:5.26
    container_name: palinor-neo4j
    restart: unless-stopped        # come back by themselves when Docker restarts
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/palinor-dev-pass
    volumes: ["neo4j-data:/data"]

  spark:
    image: apache/spark:3.5.3-python3
    container_name: palinor-spark
    restart: unless-stopped        # come back by themselves when Docker restarts
    user: root
    depends_on: [kafka]
    ports: ["4040:4040"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PALINOR_LAKE: /opt/palinor/data/lake
      PALINOR_MODELS: /opt/palinor/data/models
      HOME: /tmp
    volumes: ["./:/opt/palinor"]
    working_dir: /opt/palinor
    command: ["sh", "-c", "pip install -q numpy; sleep infinity"]  # numpy is required by MLlib

volumes:
  neo4j-data:
  kafka-data:
  hbase-data:
  hbase-zk:
